<a class="carte" href="{{ url_fiche(el) }}">
  <span class="carte-visuel"><span class="initiale" aria-hidden="true">{{ el.titre[:1] }}</span>{% if el.image %}<img src="{{ el.image }}" alt="" loading="lazy" onerror="this.remove()">{% endif %}</span>
  <span class="carte-titre">{{ el.titre }}</span>
  {% if el.sous_titre %}<span class="carte-sous-titre">{{ el.sous_titre }}</span>{% endif %}
</a>
