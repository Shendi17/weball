# Vhost de Weball pour ines-nginx. À ajouter dans monitoring/nginx/nginx.conf du dépôt INES (bloc http),
# AVANT le vhost « domaines personnalisés » (un server_name exact passe avant la regex catch-all).
# Ordre impératif, sinon ines-nginx refuse de redémarrer (certificat absent) :
#   1. DNS : enregistrement A de weball.weballone.com vers le VPS INES ;
#   2. certificat : bash scripts/add-custom-domain.sh weball.weballone.com ;
#   3. ajouter ce bloc, puis recharger ines-nginx.

    server {
        listen 80;
        server_name weball.weballone.com;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://weball.weballone.com$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name weball.weballone.com;

        ssl_certificate     /etc/nginx/certs/domains/weball.weballone.com.crt;
        ssl_certificate_key /etc/nginx/certs/domains/weball.weballone.com.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        client_max_body_size 20M;


        resolver 127.0.0.11 valid=30s ipv6=off;
        set $weball "http://weball-web:8000";

        location /static/ {
            proxy_pass $weball;
            proxy_set_header Host $host;
            expires 30d;
        }

        location / {
            proxy_pass $weball;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
